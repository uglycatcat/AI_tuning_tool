name: ai_env
channels:
  - conda-forge
  - defaults
dependencies:
  # 仅声明跨平台包，由 conda 在 win-64 上解析具体构建；勿从 Linux 导出完整显式构建串
  - python=3.13
  - pip
  - tzdata
  - pip:
      - annotated-doc==0.0.4
      - annotated-types==0.7.0
      - anthropic==0.100.0
      - anyio==4.13.0
      - certifi==2026.4.22
      - click==8.3.3
      - distro==1.9.0
      - docstring-parser==0.18.0
      - fastapi==0.136.1
      - h11==0.16.0
      - httpcore==1.0.9
      - httptools==0.7.1
      - httpx==0.28.1
      - idna==3.14
      - jiter==0.14.0
      - prompt-toolkit==3.0.52
      - pydantic==2.13.4
      - pydantic-core==2.46.4
      - pyserial==3.5
      - python-dotenv==1.2.2
      - pyyaml==6.0.3
      - sniffio==1.3.1
      - starlette==1.0.0
      - typing-extensions==4.15.0
      - typing-inspection==0.4.2
      - uvicorn==0.46.0
      # uvloop 不支持 Windows；uvicorn 会自动使用默认 asyncio 循环
      - watchfiles==1.1.1
      - wcwidth==0.7.0
      - websockets==16.0
